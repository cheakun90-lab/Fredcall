plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cheakun.fredcall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cheakun.fredcall'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    androidResources {
        noCompress 'mp3', 'ogg', 'wav', 'm4a', 'aac'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
